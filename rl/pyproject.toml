[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quoridor-rl"
version = "0.1.0"
description = "AlphaZero-lite training pipeline for Quoridor Online"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "torch>=2.2",
  "quoridor-online-sdk>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
