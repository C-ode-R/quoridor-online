services:
  trainer:
    build:
      context: .
      dockerfile: rl/Dockerfile
    restart: unless-stopped
    init: true
    stop_grace_period: 2m
    cpus: "${RL_CPUS:-2.0}"
    mem_limit: "${RL_MEMORY:-4g}"
    environment:
      RL_THREADS: ${RL_THREADS:-2}
      RL_WORKERS: ${RL_WORKERS:-2}
      RL_ITERATIONS: ${RL_ITERATIONS:-1000}
      RL_GAMES: ${RL_GAMES:-8}
      RL_SIMULATIONS: ${RL_SIMULATIONS:-100}
      RL_WALL_CANDIDATES: ${RL_WALL_CANDIDATES:-20}
      RL_TEMPERATURE_MOVES: ${RL_TEMPERATURE_MOVES:-16}
      RL_HEURISTIC_START: ${RL_HEURISTIC_START:-0.65}
      RL_HEURISTIC_END: ${RL_HEURISTIC_END:-0.10}
      RL_HEURISTIC_DECAY: ${RL_HEURISTIC_DECAY:-100}
      RL_TRAIN_STEPS: ${RL_TRAIN_STEPS:-100}
      RL_BATCH_SIZE: ${RL_BATCH_SIZE:-64}
      RL_REPLAY_CAPACITY: ${RL_REPLAY_CAPACITY:-100000}
      RL_CHANNELS: ${RL_CHANNELS:-32}
      RL_BLOCKS: ${RL_BLOCKS:-3}
      RL_LEARNING_RATE: ${RL_LEARNING_RATE:-0.001}
      RL_LEARNING_RATE_MID: ${RL_LEARNING_RATE_MID:-0.0003}
      RL_LEARNING_RATE_FINAL: ${RL_LEARNING_RATE_FINAL:-0.0001}
      RL_LR_MID_ITERATION: ${RL_LR_MID_ITERATION:-100}
      RL_LR_FINAL_ITERATION: ${RL_LR_FINAL_ITERATION:-250}
      RL_REPLAY_RECENT_FRACTION: ${RL_REPLAY_RECENT_FRACTION:-0.60}
      RL_REPLAY_RECENT_WINDOW: ${RL_REPLAY_RECENT_WINDOW:-30000}
      RL_EVAL_EVERY: ${RL_EVAL_EVERY:-10}
      RL_EVAL_GAMES: ${RL_EVAL_GAMES:-20}
      RL_EVAL_RANDOM_GAMES: ${RL_EVAL_RANDOM_GAMES:-20}
      RL_EVAL_FIXED_SEED: ${RL_EVAL_FIXED_SEED:-20260818}
      RL_EVAL_SIMULATIONS: ${RL_EVAL_SIMULATIONS:-100}
      RL_EVAL_OPENING_PLIES: ${RL_EVAL_OPENING_PLIES:-2}
      RL_PROMOTION_GAMES: ${RL_PROMOTION_GAMES:-40}
      RL_PROMOTION_RANDOM_GAMES: ${RL_PROMOTION_RANDOM_GAMES:-40}
      RL_PROMOTION_SCORE: ${RL_PROMOTION_SCORE:-0.60}
      RL_PROMOTION_SEAT_WIN_RATE: ${RL_PROMOTION_SEAT_WIN_RATE:-0.45}
      RL_SNAPSHOT_EVERY: ${RL_SNAPSHOT_EVERY:-10}
      RL_MAX_SNAPSHOTS: ${RL_MAX_SNAPSHOTS:-12}
      RL_LEAGUE_CURRENT_WEIGHT: ${RL_LEAGUE_CURRENT_WEIGHT:-0.50}
      RL_LEAGUE_CHAMPION_WEIGHT: ${RL_LEAGUE_CHAMPION_WEIGHT:-0.30}
      RL_LEAGUE_HISTORY_WEIGHT: ${RL_LEAGUE_HISTORY_WEIGHT:-0.20}
      RL_HISTORY_RECENT_SNAPSHOTS: ${RL_HISTORY_RECENT_SNAPSHOTS:-6}
      RL_HISTORY_CHAMPIONS: ${RL_HISTORY_CHAMPIONS:-3}
      RL_SAVE_REPLAY_EVERY: ${RL_SAVE_REPLAY_EVERY:-1}
      OMP_NUM_THREADS: ${RL_THREADS:-2}
      MKL_NUM_THREADS: ${RL_THREADS:-2}
    volumes:
      - rl_checkpoints:/workspace/checkpoints
      - rl_replay:/workspace/replay
      - rl_metrics:/workspace/metrics

volumes:
  rl_checkpoints:
  rl_replay:
  rl_metrics:
